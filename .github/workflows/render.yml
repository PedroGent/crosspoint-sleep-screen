name: Render sleep screen

on:
  schedule:
    - cron: "0 * * * *"        # best-effort backup only: GitHub may delay or drop scheduled runs
  workflow_dispatch: {}          # "Run workflow" button, and the API call used by an external scheduler
  push:
    branches: [main]
    paths: [config.json, render.js, core.js, package.json, "fonts/**", ".github/workflows/render.yml"]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false      # never cancel a run that is publishing

jobs:
  render:
    runs-on: ubuntu-24.04        # pinned: "ubuntu-latest" is moving to a newer image
    timeout-minutes: 10
    env:
      TZ: Europe/Brussels
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Render
        run: node render.js

      - name: Publish to the "output" branch
        run: |
          cd out
          git init -q -b output
          git config user.name "sleep-screen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
